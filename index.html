function renderWorkspace(){persist();let t=TOPICS.find(t=>t[0]===saved.topic);$('workspaceTitle').textContent=(t?t[2]:'المفردات')+' · '+saved.level;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('on',b.dataset.filter===filter));let w=active();if(!w){$('learning').innerHTML='<div class="empty">لا توجد مفردات لهذا الاختيار.</div>';return}let [lvl,topic,kind,word,meaning,example,translation,note]=w,kindLabel={verb:'فعل',noun:'اسم',adj:'صفة'}[kind],wid=id(w);let head=`<span class="tag">${lvl} · ${kindLabel} · ${index%pool().length+1} / ${pool().length}</span>`;let html='';if(mode==='study'){html=`<div class="card">${head}<div class="german" lang="de">${esc(word)}</div><div class="arabic">${esc(meaning)}</div><div class="ex" lang="de">${esc(example)}</div><div class="tr">${esc(translation)}</div><div class="note">${esc(note)}</div><div class="actions"><button class="btn alt" id="play">🔊 استمع</button><button class="btn fav" id="favorite">${saved.favorites[wid]?'★ إزالة المفضلة':'☆ المفضلة'}</button></div><div class="actions"><button class="btn" id="markKnown">✓ حفظتها</button><button class="btn alt" id="markHard">🔁 صعبة</button><button class="btn alt" id="next">التالي ←</button></div><div id="audioStatus" class="notice"></div></div>`}
else if(mode==='choice'||mode==='listen'){let options=[w,...WORDS.filter(x=>x[0]===lvl&&x[3]!==word)].sort((a,b)=>a[3].localeCompare(b[3])).slice(0,8);options=options.filter(x=>x!==w).slice(0,3).concat(w);options=options.sort((a,b)=>hash(a[3]+word)-hash(b[3]+word));html=`<div class="card">${head}<div class="prompt">${mode==='listen'?'استمع للكلمة ثم اختر معناها':'ما معنى الكلمة التالية؟'}</div>${mode==='choice'?`<div class="german" lang="de">${esc(word)}</div>`:`<div class="actions"><button class="btn" id="play">🔊 تشغيل الكلمة</button></div>`}<div id="answers">${options.map(x=>`<button class="choice" data-answer="${esc(id(x))}">${esc(x[4])}</button>`).join('')}</div><div id="feedback"></div><div class="actions"><button class="btn alt" id="next">السؤال التالي ←</button></div><div id="audioStatus" class="notice"></div></div>`}
else if(mode==='spell'){html=`<div class="card">${head}<div class="prompt">اكتب الكلمة الألمانية التي تعني:</div><div class="arabic">${esc(meaning)}</div><div class="actions"><button class="btn alt" id="play">🔊 استمع للتلميح</button></div><div style="margin-top:17px"><input id="typed" class="input" lang="de" autocomplete="off" spellcheck="false" placeholder="Schreibe auf Deutsch..."></div><div id="feedback"></div><div class="actions"><button class="btn" id="check">تحقق ✓</button><button class="btn alt" id="next">التالي ←</button></div><div id="audioStatus" class="notice"></div></div>`}
else{html=`<div class="card">${head}<div class="german" lang="de">${esc(word)}</div><div class="arabic">${esc(meaning)}</div><div class="actions"><button class="btn alt" id="play">🔊 استمع</button><button class="btn" id="record">🎙️ ابدأ النطق</button></div><div class="notice">انطق الكلمة بعد سماعها. التعرف على الكلام قد لا يعمل دون إنترنت أو داخل الملفات المحلية.</div><div id="audioStatus" class="feedback">اضغط على زر الميكروفون.</div><div class="actions"><button class="btn alt" id="next">الكلمة التالية ←</button></div></div>`}
$('learning').innerHTML=html;let play=$('play');if(play)play.onclick=()=>say(word);let next=$('next');if(next)next.onclick=()=>{index++;answered=false;renderWorkspace()};let fav=$('favorite');if(fav)fav.onclick=()=>{if(saved.favorites[wid])delete saved.favorites[wid];else saved.favorites[wid]=true;persist();renderWorkspace()};let known=$('markKnown');if(known)known.onclick=()=>{saved.known[wid]=true;delete saved.hard[wid];saved.stars+=5;index++;renderWorkspace()};let hard=$('markHard');if(hard)hard.onclick=()=>{saved.hard[wid]=true;index++;renderWorkspace()};if(mode==='choice'||mode==='listen')document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let ok=b.dataset.answer===wid;b.classList.add(ok?'good':'bad');document.querySelectorAll('[data-answer]').forEach(x=>{if(x.dataset.answer===wid)x.classList.add('good')});score(ok,w);$('feedback').innerHTML=`<div class="feedback">${ok?'✓ صحيح! +10 نجوم':'✗ الإجابة الصحيحة: '+esc(meaning)}</div>`});let check=$('check');if(check)check.onclick=()=>{if(answered)return;answered=true;let typed=$('typed').value.trim().toLocaleLowerCase('de-DE');let ok=typed===word.toLocaleLowerCase('de-DE');score(ok,w);$('feedback').innerHTML=`<div class="feedback">${ok?'✓ ممتاز! +10 نجوم':'✗ الإجابة الصحيحة: <b dir="ltr">'+esc(word)+'</b>'}</div>`};let typed=$('typed');if(typed)typed.onkeydown=e=>{if(e.key==='Enter')check.click()};let record=$('record');if(record)record.onclick=()=>recognize(word)}
function hash(s){let h=0;for(let c of s)h=((h<<5)-h+c.charCodeAt(0))|0;return h}
function score(ok,w){let k=id(w);if(ok){saved.stars+=10;saved.known[k]=true;delete saved.hard[k]}else saved.hard[k]=true;persist()}
function say(text){let el=$('audioStatus');if(!('speechSynthesis' in window)){if(el)el.textContent='الاستماع غير متاح في هذا المتصفح.';return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.82;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase().startsWith('de')&&v.localService)||voices.find(v=>v.lang.toLowerCase().startsWith('de'));if(v)u.voice=v;if(el)el.textContent=v&&v.localService?'🔊 تشغيل الصوت المحلي':'🔊 تشغيل الصوت؛ قد يلزم اتصال حسب الجهاز';speechSynthesis.speak(u)}catch{if(el)el.textContent='تعذر تشغيل الصوت.'}}
function recognize(word){let el=$('audioStatus'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){el.textContent='التعرف على الكلام غير مدعوم هنا. استمع وكرر الكلمة بنفسك.';return}try{let r=new SR();r.lang='de-DE';r.interimResults=false;r.maxAlternatives=1;el.textContent='🎙️ تحدث الآن...';r.onresult=e=>{let heard=e.results[0][0].transcript,clean=s=>s.toLocaleLowerCase('de-DE').replace(/[.!?,]/g,'').trim();el.textContent='سمعت: '+heard+(clean(heard)===clean(word)?' — ✓ نطق مطابق':' — حاول مجددًا')};r.onerror=e=>el.textContent='تعذر التعرف على الصوت. قد يتطلب اتصالًا بالإنترنت أو إذن الميكروفون.';r.start()}catch{el.textContent='تعذر تشغيل الميكروفون في هذا المتصفح.'}}
function showCollection(which){collection=which;setPage('collection');$('collectionTitle').textContent=which==='favorites'?'⭐ الكلمات المفضلة':'🔁 الكلمات الصعبة';let list=WORDS.filter(w=>saved[which==='favorites'?'favorites':'hard'][id(w)]);$('collectionContent').innerHTML=list.length?list.map(w=>`<div class="card" style="margin-top:10px"><span class="tag">${w[0]} · ${TOPICS.find(t=>t[0]===w[1])[2]}</span><div class="german" style="font-size:23px" lang="de">${esc(w[3])}</div><div class="arabic" style="font-size:17px">${esc(w[4])}</div><div class="actions"><button class="btn alt" data-review="${esc(id(w))}">📖 راجع الكلمة</button></div></div>`).join(''):'<div class="empty">لا توجد كلمات هنا بعد. أضف كلمات أثناء الحفظ.</div>';document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{let w=WORDS.find(x=>id(x)===b.dataset.review);if(!w)return;saved.level=w[0];saved.topic=w[1];filter='all';index=pool().findIndex(x=>id(x)===id(w));openWorkspace('study')})}
$('startStudy').onclick=()=>openWorkspace('study');$('startQuiz').onclick=()=>openWorkspace('choice');$('back').onclick=()=>{setPage('home');renderHome()};$('navHome').onclick=()=>{setPage('home');renderHome()};$('navStudy').onclick=()=>openWorkspace('study');$('navTrain').onclick=()=>openWorkspace('choice');$('navFav').onclick=()=>showCollection('favorites');$('navHard').onclick=()=>showCollection('hard');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>openWorkspace(b.dataset.mode));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;index=0;answered=false;renderWorkspace()});renderHome();setPage('home');
</script><script>if ("serviceWorker" in navigator) {window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
